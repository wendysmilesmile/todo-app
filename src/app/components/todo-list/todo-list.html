<mat-card appearance="outlined" style="max-width: 720px; margin: 2rem auto; padding: 1rem;">
  <mat-card-header>
    <mat-card-title>Todo List</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <app-todo-add-item [title]="newTitle" (titleChange)="newTitle = $event" (add)="addTodo($event)"></app-todo-add-item>

    @if (loading()) {
      <app-is-loading></app-is-loading>
    }

    @if (errorMessage()) {
      <app-error-message [message]="errorMessage()"></app-error-message>
    }

    @if (!loading() && visibleTodos().length === 0) {
      <app-empty-state></app-empty-state>
    }

    <div style="display: grid; gap: 0.75rem; margin-top: 0.75rem;">
      @for (item of visibleTodos(); track item.id) {
        <app-todo-item
          [item]="item"
          [isEditing]="editingId() === item.id"
          [editTitle]="editTitle"
          (startEdit)="startEdit($event)"
          (editTitleChange)="editTitle = $event"
          (saveEdit)="saveEdit($event)"
          (cancelEdit)="cancelEdit()"
          (deleteItem)="softDelete($event)"
        ></app-todo-item>
      }
    </div>
  </mat-card-content>
</mat-card>
