<mat-card appearance="outlined">
  @if (isEditing) {
    <mat-card-content
      style="display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem; flex-wrap: wrap;"
    >
      <mat-form-field appearance="outline" style="flex: 1; min-width: 220px;">
        <mat-label>Edit title</mat-label>
        <input
          matInput
          [ngModel]="editTitle"
          (ngModelChange)="editTitleChange.emit($event)"
          (keyup.enter)="saveEdit.emit(item.id)"
        />
      </mat-form-field>

      <div style="display: flex; gap: 0.5rem;">
        <button mat-flat-button color="primary" type="button" (click)="saveEdit.emit(item.id)">Save</button>
        <button mat-stroked-button type="button" (click)="cancelEdit.emit()">Cancel</button>
      </div>
    </mat-card-content>
  } @else {
    <mat-card-content
      style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 1rem;"
    >
      <span>{{ item.title }}</span>
      <div style="display: flex; gap: 0.5rem;">
        <button mat-stroked-button color="primary" type="button" (click)="startEdit.emit(item)">Edit</button>
        <button mat-stroked-button color="warn" type="button" (click)="deleteItem.emit(item.id)">Delete</button>
      </div>
    </mat-card-content>
  }
</mat-card>
